<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>林峰 · 作品集 2026 一页版</title>
<link rel="stylesheet" href="assets/css/print.css">
<style>
  .card{
    width:210mm;height:296.6mm;padding:16mm;background:var(--paper);
    display:flex;flex-direction:column;position:relative;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .card-top{
    display:flex;justify-content:space-between;
    border-bottom:.35pt solid var(--line);padding-bottom:2.2mm;
    font-size:6.6pt;letter-spacing:.26em;color:var(--muted);text-transform:uppercase;
  }
  .card-main{flex:1;display:grid;grid-template-columns:1fr 62mm;gap:12mm;padding-top:12mm}
  .card h1{margin:0;font-family:var(--serif);font-weight:500;font-size:76pt;line-height:.9;letter-spacing:-.045em}
  .card .latin{margin-top:4mm;font-size:6.4pt;letter-spacing:.56em;color:var(--muted);text-transform:uppercase}
  .card .sub{margin-top:6mm;font-family:var(--serif);font-size:14pt;letter-spacing:.09em}
  .card .lead{margin-top:3mm;font-size:8.6pt;line-height:1.95;color:var(--muted)}
  .card .statline{
    display:grid;grid-template-columns:1fr 1fr;gap:4mm 6mm;
    margin-top:9mm;padding-top:4mm;border-top:.35pt solid var(--line);
  }
  .card .statline b{display:block;font-family:var(--serif);font-weight:400;font-size:17pt;line-height:1.1}
  .card .statline b small{font-size:8pt;color:var(--accent);margin-left:.4mm}
  .card .statline span{display:block;margin-top:1.4mm;font-size:6.2pt;letter-spacing:.2em;color:var(--muted)}
  .card .contact{margin-top:9mm;padding-top:3.4mm;border-top:.35pt solid var(--line)}
  .card .contact li{
    display:grid;grid-template-columns:20mm 1fr;gap:3mm;align-items:baseline;
    padding:2.2mm 0;border-bottom:.35pt solid var(--line);
  }
  .card .contact span{font-size:6pt;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
  .card .contact b{font-family:var(--serif);font-weight:400;font-size:9.4pt;letter-spacing:.04em}
  .card-right{display:flex;flex-direction:column;align-items:flex-start}
  .card-qr{background:#fff;padding:3mm;border:.35pt solid var(--line)}
  .card-qr img{width:52mm;height:52mm;display:block}
  .card-qr figcaption{margin-top:2.4mm;font-size:6pt;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;text-align:center}
  .card-url{margin-top:5mm;font-family:var(--mono);font-size:6.4pt;line-height:1.7;color:var(--muted);word-break:break-all}
  .card-thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:3mm;margin-top:auto;padding-top:6mm}
  .card-thumbs img{width:100%;height:34mm;object-fit:cover;display:block}
  .card-thumbs figcaption{margin-top:1.4mm;font-size:5.8pt;letter-spacing:.08em;color:var(--muted)}
  .card-foot{
    margin-top:6mm;padding-top:2.4mm;border-top:.35pt solid var(--line);
    display:flex;justify-content:space-between;font-size:6.2pt;letter-spacing:.1em;color:var(--muted);
  }
</style>
</head>
<body>
<section class="card">
  <div class="card-top"><span>作品集 2026 <i>/</i> 一页版</span><span>求职：新媒体运营 · 摄影</span></div>

  <div class="card-main">
    <div>
      <h1>林峰</h1>
      <p class="latin">LIN FENG</p>
      <p class="sub">新媒体运营 · 摄影 · 版式设计</p>
      <p class="lead">会拍，会剪，也会把它们排好。<br>抖音账号单条最高 48.9 万播放；《Film》摄影画册 22 页。</p>

      <div class="statline">
        <div><b>48.9<small>万</small></b><span>单条最高播放</span></div>
        <div><b>1.1<small>万</small></b><span>单条最高点赞</span></div>
        <div><b>22<small>页</small></b><span>画册版面</span></div>
        <div><b>5<small>组</small></b><span>摄影作品</span></div>
      </div>

      <ul class="contact">
        <li><span>电话</span><b>133 5829 5397</b></li>
        <li><span>微信</span><b>Agni-0618</b></li>
        <li><span>邮箱</span><b>1990727415@qq.com</b></li>
        <li><span>抖音</span><b>69299701615</b></li>
        <li><span>学校</span><b>福州理工学院 · 建筑电气与智能化（专升本）</b></li>
      </ul>
    </div>

    <div class="card-right">
      <figure class="card-qr">
        <img src="assets/img/qr-site.png" alt="作品集二维码">
        <figcaption>扫码看完整作品集</figcaption>
      </figure>
      <p class="card-url">__URL__</p>
    </div>
  </div>

  <div class="card-thumbs">
    <figure><img src="assets/img/photo/p2-s.jpg" alt="夜景"><figcaption>摄影 · 東京</figcaption></figure>
    <figure><img src="assets/img/photo/p1-s.jpg" alt="海边婚礼"><figcaption>摄影 · 海岸</figcaption></figure>
    <figure><img src="assets/img/design/d04-s.jpg" alt="画册内页"><figcaption>版式 ·《Film》</figcaption></figure>
    <figure><img src="assets/img/design/d12-s.jpg" alt="画册内页"><figcaption>版式 · 内页</figcaption></figure>
    <figure><img src="assets/img/ops/op1.jpg" alt="抖音作品"><figcaption>运营 · 48.9 万</figcaption></figure>
  </div>

  <div class="card-foot"><span>© 2026 林峰 · 作品集</span><span>2026 秋 · 求职</span></div>
</section>
</body>
</html>
